<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湖北省公路事业发展中心数据统筹治理平台</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; 
            background-color: #f8fafc; 
            overflow: hidden;
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .active-menu-item {
            background-color: #2563eb !important;
            color: #ffffff !important;
            font-weight: 600;
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 架构图连线动画 */
        .flow-line {
            stroke-dasharray: 8, 8;
            animation: dash 30s linear infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: -1000;
            }
        }
        
        /* 架构图动态连线特效 - 白底高对比彩色流 */
        .flow-track { stroke-linecap: round; opacity: 0.25; stroke: #cbd5e1; }
        .particle-data { stroke-dasharray: 20, 30; animation: dash-data 4s linear infinite; filter: drop-shadow(0 0 6px #06b6d4); stroke-linecap: round; }
        .particle-biz { stroke-dasharray: 20, 30; animation: dash-biz 4s linear infinite; filter: drop-shadow(0 0 6px #ea580c); stroke-linecap: round; }
        .particle-rule { stroke-dasharray: 20, 30; animation: dash-rule 4s linear infinite; filter: drop-shadow(0 0 6px #7c3aed); stroke-linecap: round; }
        
        @keyframes dash-data { to { stroke-dashoffset: -150; } }
        @keyframes dash-biz { to { stroke-dashoffset: -150; } } 
        @keyframes dash-rule { to { stroke-dashoffset: -150; } } 

        /* 提升界面整体字体大小 */
        .text-\[9px\] { font-size: 11px !important; }
        .text-\[10px\] { font-size: 12px !important; }
        .text-\[11px\] { font-size: 13px !important; }
        .text-xs { font-size: 14px !important; }
        .text-sm { font-size: 16px !important; }
        .text-base { font-size: 18px !important; }
        .text-lg { font-size: 20px !important; }
        .text-xl { font-size: 23px !important; }
        .text-2xl { font-size: 26px !important; }
        .text-3xl { font-size: 32px !important; }
        
        /* 使用向导高亮步骤 */
        .wizard-step-highlight {
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.4), 0 0 15px rgba(244, 63, 94, 0.6);
            animation: pulse-border 2s infinite;
            border-color: rgba(244, 63, 94, 0.8) !important;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0px rgba(244, 63, 94, 0.5), 0 0 15px rgba(244, 63, 94, 0.6); }
            70% { box-shadow: 0 0 0 6px rgba(244, 63, 94, 0), 0 0 15px rgba(244, 63, 94, 0.6); }
            100% { box-shadow: 0 0 0 0px rgba(244, 63, 94, 0), 0 0 15px rgba(244, 63, 94, 0.6); }
        }
        
        /* 玻璃质感浮动面板 */
        .wizard-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="./app.js"></script>
</body>
</html>
